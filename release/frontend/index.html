<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>League Active Game Helper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1319; --card: #1a2029; --border: #2a3342;
    --text: #dbe4f0; --muted: #8494ab; --accent: #4fc3f7;
    --aggressive: #ef7b66; --defensive: #64b5f6; --balanced: #9ccc65;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 20px 0 8px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: .85rem; }
  #refreshBtn { background: var(--card); color: var(--accent);
                border: 1px solid var(--border); border-radius: 50%;
                width: 30px; height: 30px; font-size: 1rem; cursor: pointer;
                line-height: 1; }
  #refreshBtn:hover { border-color: var(--accent); }
  #refreshBtn.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 12px 14px; }
  .stance { display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-weight: 600; font-size: .8rem; color: #10141a; }
  .stance.aggressive { background: var(--aggressive); }
  .stance.defensive  { background: var(--defensive); }
  .stance.balanced   { background: var(--balanced); }
  #next.card { border-color: var(--accent); margin-bottom: 4px;
               display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  #next .itemname { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  #next .gold { font-variant-numeric: tabular-nums; font-weight: 600; }
  #next .gold.ok { color: var(--balanced); }
  #next .gold.missing { color: var(--aggressive); }
  #next .swap { font-weight: 600; color: var(--aggressive); }
  /* Kaufplan-Leiste (Feature 001): Icon-Schritte direkt unter dem Next-Block. */
  #plan { display: flex; align-items: center; gap: 4px; margin: 6px 0 2px;
          overflow-x: auto; padding: 2px 0 6px; }
  #plan .step { flex: none; border-radius: 8px; background: #10151d;
                border: 2px solid transparent; padding: 3px; line-height: 0; }
  #plan .step img { display: block; border-radius: 6px; }
  #plan .step-final img { width: 68px; height: 68px; }      /* -10% vom 64px Next-Icon */
  #plan .step-component img { width: 45px; height: 45px; }  /* ~-30% -> klar kleiner als Finals */
  #plan .step.afford { border-color: #f0c419;               /* goldener Ring, kraeftiger */
                       box-shadow: 0 0 9px rgba(240, 196, 25, .7); }
  #plan .step.upgrade { border-style: dashed; border-color: var(--balanced); }
  #plan .chevron { flex: none; color: var(--muted); font-weight: 700;
                   font-size: 1.1rem; }
  #confidence { margin: 2px 0 6px; }
  #confidence .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-weight: 600; font-size: .72rem; background: var(--aggressive);
            color: #10141a; margin-right: 8px; }
  #recs .card { margin-bottom: 8px; display: flex; gap: 12px; align-items: baseline; }
  #recs .card.alt { opacity: .68; }   /* zweite Boots-Option (Sichtbarkeit) */
  /* Schnitt zwischen der gewichteten Liste (pool: true) und allem, was auf einer
     eigenen Score-Skala laeuft (Boots, Klassen-Fallback, Anti-Heal ...). Bewusst
     gedaempft: der Block ist eine Ergaenzung, kein zweites Ranking. */
  #recs .sep { color: var(--muted); font-size: .72rem; font-weight: 600;
               text-transform: uppercase; letter-spacing: .08em;
               border-top: 1px solid var(--border); margin: 16px 0 8px;
               padding-top: 8px; }
  #recs .item { font-weight: 600; min-width: 180px; }
  #recs .kind { font-size: .7rem; text-transform: uppercase; color: var(--accent); min-width: 80px; }
  .iicon { width: 56px; height: 56px; border-radius: 6px; flex: none; align-self: center; }
  #next .iicon { width: 64px; height: 64px; }
  /* Zweck-Badge ("wogegen": Anti-Tank, Anti-AD, ...). Die Grundklasse ist
     NEUTRAL (Outline) - gefuelltes Accent-Blau kollidierte mit der Stance-
     Farbwelt (--defensive). Gefuellt wird nur ueber die Achse: .off = das Item
     schlaegt zu (gruen), .def = das Item haelt aus (defensiv-blau). */
  .tag { display: inline-block; font-size: .68rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px;
         border-radius: 6px; border: 1px solid var(--border); color: var(--muted);
         background: transparent; white-space: nowrap; }
  #recs .tag { min-width: 96px; text-align: center; flex: none; }
  .tag.off { background: var(--balanced); border-color: var(--balanced); color: #10141a; }
  .tag.def { background: var(--defensive); border-color: var(--defensive); color: #10141a; }
  /* Natur-Badges ("was es dir gibt": +HP/+Ruestung/+MR) - Outline in der
     defensiven Farbe, damit die defensive Haelfte von Hybriden sichtbar wird. */
  .statbadge { display: inline-block; font-size: .62rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--defensive);
         color: var(--defensive); background: transparent; white-space: nowrap; }
  .src-class { display: inline-block; font-size: .64rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--border); color: var(--muted);
         white-space: nowrap; }
  /* CORE-Badge: markiert das Item aus dem gelernten Core-Build. */
  .core-badge { display: inline-block; font-size: .64rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--accent); color: var(--accent);
         white-space: nowrap; }
  /* Kaufstaerke relativ zur Top-Empfehlung (nur Pool-Kandidaten): schmaler
     Balken + Zahl, 100 % = staerkstes Kaufsignal. Bewusst dezent in der
     Muted-Farbwelt - die Zahl ordnet ein, sie ist kein zweites Ranking.
     Gross genug zum Ablesen (.85rem): bei .66rem war die Zahl auf dem Monitor
     im Spiel nicht mehr zu erkennen. */
  .nowrel { display: inline-block; font-size: .85rem; font-weight: 700;
         color: var(--muted); font-variant-numeric: tabular-nums;
         white-space: nowrap; }
  .nowrel .track { display: inline-block; vertical-align: middle;
         width: 56px; height: 6px; margin-right: 6px; border-radius: 3px;
         background: #10151d; border: 1px solid var(--border);
         overflow: hidden; }
  .nowrel .fill { display: block; height: 100%; border-radius: 3px;
         background: var(--balanced); }
  /* In der Liste steht der Balken DIREKT hinter dem Itemnamen (der hat
     min-width, also alignen die Balken untereinander). Vorher stand er am Ende
     hinter den Stat-Badges - und weil je Karte 0, 1 oder 2 Stat-Badges kommen,
     rutschte jeder Balken auf eine andere x-Position: nichts war vergleichbar.
     Die feste Mindestbreite haelt die nachfolgenden Zweck-Badges in einer
     Spalte, auch bei Karten ohne Kaufstaerke (unsichtbarer Platzhalter). */
  #recs .nowrel { min-width: 112px; flex: none; }
  .spike { font-size: .78rem; font-weight: 600; color: var(--aggressive);
           margin: 2px 0; }
  .spike.high { color: #ff5252; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .enemy .name { font-weight: 600; display: flex; justify-content: space-between; }
  .enemy .profile { color: var(--accent); font-size: .8rem; }
  .bar { height: 6px; border-radius: 3px; background: #345; margin: 6px 0;
         overflow: hidden; display: flex; }
  .bar .ad { background: #ef7b66; height: 100%; }
  .bar .ap { background: #7e97f7; height: 100%; }
  .threat { font-variant-numeric: tabular-nums; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 2px 6px; margin-top: 6px; }
  .itemlist { font-size: .78rem; color: var(--muted); margin-top: 6px; }
  #nogame { margin-top: 40px; text-align: center; color: var(--muted); }
  /* "Match-Report bereit"-Button (Endscreen): grosser, auffaelliger Link auf
     den fertigen Post-Game-Report. Wird nur ausserhalb des laufenden Spiels
     gezeigt (no_game/post_game) - im Spiel hat die Live-Ansicht Vorrang. */
  /* WICHTIG: display:block wuerde das UA-[hidden]-display:none ueberschreiben,
     dann waere der Banner IMMER sichtbar (leerer Klick-Balken vor dem ersten
     Report). Daher [hidden] explizit auf display:none pinnen. */
  #reportBanner[hidden] { display: none; }
  #reportBanner { display: block; text-decoration: none; margin: 18px 0;
    padding: 16px 22px; border-radius: 12px; text-align: center;
    font-size: 1.15rem; font-weight: 700; color: #10141a; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--balanced));
    box-shadow: 0 0 16px rgba(79, 195, 247, .45);
    transition: transform .1s ease, box-shadow .1s ease; }
  #reportBanner:hover { transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(79, 195, 247, .65); }
  #reportBanner .report-badge { display: inline-block; margin-left: 12px;
    padding: 2px 12px; border-radius: 20px; vertical-align: middle;
    font-size: .78rem; font-weight: 600; background: rgba(16, 20, 26, .28); }
  /* Link auf die Match-History-Seite: bewusst DEZENT (Sekundaer-Button, kein
     Verlauf/Glow) - er steht immer unten und darf dem Report-Banner nicht die
     Aufmerksamkeit nehmen. Immer sichtbar, also kein [hidden]-Handling noetig. */
  #historyLink { display: inline-block; margin: 34px 0 6px; padding: 9px 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--muted); text-decoration: none; font-size: .9rem;
    font-weight: 600; }
  #historyLink:hover { border-color: var(--accent); color: var(--accent); }
  /* Item-Tooltip (Hover ueber ein Item-Icon): EIN globales Element, das per
     position:fixed an die Maus gehaengt wird. pointer-events:none ist wichtig -
     sonst schoebe sich der Tooltip unter den Cursor, loeste dort ein mouseout
     auf dem Icon aus und flackerte. [hidden] explizit pinnen, weil die eigenen
     display-Regeln sonst das UA-Default ueberschreiben (gleiche Falle wie beim
     Report-Banner). */
  #tooltip[hidden] { display: none; }
  #tooltip { position: fixed; left: 0; top: 0; z-index: 100; display: block;
    max-width: 380px; pointer-events: none;
    background: var(--card); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font-size: .82rem; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  #tooltip .tt-name { font-weight: 700; font-size: .95rem; color: var(--accent); }
  #tooltip .tt-gold { font-weight: 600; font-variant-numeric: tabular-nums;
    color: #f0c419; }
  #tooltip .tt-plain { color: var(--muted); font-style: italic; margin-top: 4px; }
  #tooltip .tt-body { margin-top: 8px; border-top: 1px solid var(--border);
    padding-top: 8px; }
  /* Riot-Markup-Klassen: die Beschreibung aus Data Dragon traegt eigene Tags
     (<passive>, <magicDamage>, ...). Sie werden NICHT roh ins DOM gelassen,
     sondern nach dem Escapen ueber eine Whitelist in genau diese Klassen
     uebersetzt (s. riotText). Farbwelt bewusst nah am Spiel-Tooltip. */
  #tooltip .tt-passive { font-weight: 700; color: var(--accent); }
  #tooltip .tt-active { font-weight: 700; color: #f0c419; }
  #tooltip .tt-attention { font-weight: 700; color: var(--text); }
  #tooltip .tt-keyword { font-weight: 600; color: var(--accent); }
  #tooltip .tt-stats { color: var(--text); }
  #tooltip .tt-rules { color: var(--muted); font-style: italic; font-size: .95em; }
  #tooltip .tt-magic { color: #7e97f7; }
  #tooltip .tt-phys { color: var(--aggressive); }
  #tooltip .tt-true { color: #e8dfc8; }
  #tooltip .tt-heal { color: var(--balanced); }
  #tooltip .tt-shield { color: #cfd8dc; }
  #tooltip .tt-status { color: #ffd54f; }
  #tooltip .tt-legendary { color: #e0b465; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <h1>League Active Game Helper</h1>
    <span class="muted" id="meta"></span>
    <span class="muted" id="countdown"></span>
    <button id="refreshBtn" title="Jetzt aktualisieren" onclick="refresh()">&#10227;</button>
  </div>

  <a id="reportBanner" href="#" target="_blank" rel="noopener" hidden></a>

  <div id="nogame" hidden>Kein aktives Spiel gefunden – warte auf Spielstart …</div>

  <div id="game" hidden>
    <h2>Du</h2>
    <div class="card" id="me"></div>

    <h2>N&auml;chstes Item</h2>
    <div id="confidence"></div>
    <div class="card" id="next"></div>

    <div id="planblock" hidden>
      <h2>Item-Timeline</h2>
      <div id="plan"></div>
    </div>

    <h2>Situational</h2>
    <div id="stanceline" style="margin-bottom:8px"></div>
    <div id="recs"></div>

    <h2>Gegner (nach Threat sortiert)</h2>
    <div class="grid" id="enemies"></div>
  </div>

  <!-- Immer sichtbar, ganz unten: Einstieg in die Match-History-Seite. -->
  <div><a id="historyLink" href="history.html">&#128220; Match History Reports</a></div>

  <!-- EIN globaler Item-Tooltip fuer alle Icons (Next, Liste, Timeline). Ein
       Element pro Icon waere Verschwendung und muesste bei jedem Neurendern
       mitwandern; dieses hier lebt ausserhalb der neu gebauten Container. -->
  <div id="tooltip" hidden></div>

<script>
const PRIOS = ["low", "medium", "high", "urgent"];

// HTML-Escaping fuer interpolierte API-Strings (v.a. Champion-Namen). Ohne das
// brechen Apostroph-Champions (Kha'Zix, Cho'Gath, Vel'Koz, K'Sante ...) das
// Markup bzw. inline-Handler auf.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Farbe des Zweck-Badges kommt aus der ACHSE (rec.tag_axis), nicht mehr aus dem
// Tag-Text: "Anti-Tank" ist ein OFFENSIVES Item (Void Staff), "Anti-AD" ein
// defensives - am Wort "Anti-" waren beide nicht zu unterscheiden.
// hybrid zaehlt als offensiv (es schlaegt zu), die Stat-Badges zeigen daneben,
// was das Item defensiv mitbringt. Ohne Achse (Consumables, alte Payloads):
// neutrales Outline-Badge.
function tagClass(rec) {
  const ax = rec && rec.tag_axis;
  if (ax === "off" || ax === "hybrid") return "tag off";
  if (ax === "def") return "tag def";
  return "tag";
}

// Natur-Badges ("+HP"/"+Ruestung"/"+MR") hinter dem Zweck-Badge.
function statBadges(rec) {
  return ((rec && rec.stats) || [])
    .map(s => `<span class="statbadge">${esc(s)}</span>`).join(" ");
}

// Kaufstaerke-Anzeige (`now_rel`): Balken + Zahl, 100 % traegt der staerkste
// vergleichbare Kandidat. Die Skala ist bewusst RELATIV und kein Anteil an der
// Summe mehr - "19 % jetzt" wurde als Konfidenz gelesen ("nur zu 19 % sicher"),
// obwohl es der Sieger war, und die Zahl hing an der Listenlaenge.
function relBar(v) {
  const w = Math.max(0, Math.min(100, v));
  return `<span class="nowrel" title="Kaufst&auml;rke relativ zur Top-Empfehlung (100 % = st&auml;rkstes Kaufsignal)"
     ><span class="track"><span class="fill" style="width:${w}%"></span></span>${v} %</span>`;
}

async function setPriority(champion, priority) {
  await fetch("/api/priority", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({champion, priority}),
  });
  refresh();
}

function enemyCard(e, spike) {
  const ad = Math.round(e.damage_split.ad * 100);
  const ap = Math.round(e.damage_split.ap * 100);
  const opts = PRIOS.map(p =>
    `<option value="${p}" ${p === e.priority ? "selected" : ""}>${p}</option>`).join("");
  const spikeLine = spike
    ? `<div class="spike ${spike.urgency}" title="Item-Vorsprung">⚡ ${spike.message}</div>`
    : "";
  return `<div class="card enemy">
    <div class="name"><span>${esc(e.name)}
      ${e.role ? `<span class="muted">${esc(e.role)}</span>` : ""}</span>
      <span class="threat" title="Anteil an der Team-Bedrohung (inkl. deiner Prio)">⚠ ${e.threat_share != null ? Math.round(e.threat_share * 100) + " %" : e.threat_score}</span></div>
    ${spikeLine}
    <div class="profile">${esc(e.build_profile)} · ${e.gold_spent} G · KDA ${e.kda}</div>
    <div class="bar"><div class="ad" style="width:${ad}%"></div>
                     <div class="ap" style="width:${ap}%"></div></div>
    <div class="muted">${ad}% AD / ${ap}% AP</div>
    <label class="muted">Prio:
      <select class="prio" data-champion="${esc(e.name)}">${opts}</select></label>
    <div class="itemlist">${esc(e.items.join(", ")) || "keine Items"}</div>
  </div>`;
}

function render(s) {
  if (s.refresh_seconds) REFRESH_MS = s.refresh_seconds * 1000;
  const game = s.phase === "in_game" || s.phase === "post_game";
  document.getElementById("nogame").hidden = game;
  document.getElementById("game").hidden = !game;
  let meta = `Patch ${s.patch}`;
  if (game) meta += ` · ${Math.floor(s.game_time / 60)} min`;
  if (s.phase === "post_game") meta += " · Spiel beendet – letzter Stand";
  document.getElementById("meta").textContent = meta;

  // "Match-Report bereit"-Button: nur ausserhalb des laufenden Spiels zeigen
  // (Endscreen = no_game/post_game). Waehrend ein Spiel laeuft (in_game) hat die
  // Live-Ansicht Vorrang -> Button ausgeblendet. Link oeffnet in neuem Tab; bei
  // Stufe-2-Aufwertung eine Zusatz-Badge "inkl. Schaden-Analyse".
  const rep = s.postgame_report, banner = document.getElementById("reportBanner");
  if (rep && rep.url && s.phase !== "in_game") {
    banner.href = rep.url;
    banner.innerHTML = "📊 Match-Report bereit"
      + (rep.enriched ? '<span class="report-badge">inkl. Schaden-Analyse</span>' : "");
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }

  if (!game) return;

  const p = s.player, r = s.recommendations;
  document.getElementById("me").innerHTML =
    `<b>${p.name}</b> <span class="muted">${p.role}</span> ·
     ${p.scores.kills}/${p.scores.deaths}/${p.scores.assists} ·
     ${p.gold_spent} G ausgegeben
     <div class="itemlist">${p.items.join(", ") || "keine Items"}</div>`;

  const n = r.next;
  if (n) {
    const rest = n.cost_remaining !== undefined ? n.cost_remaining : n.cost;
    const price = rest < n.cost
      ? `${rest} G (${n.cost} G, davon ${n.cost - rest} G durch Teilitems gedeckt)`
      : `${n.cost} G`;
    let gold = price;
    if (n.current_gold !== undefined) {
      const missing = rest - n.current_gold - (n.sell_value || 0);
      gold = n.affordable
        ? `<span class="gold ok">${price} – kaufbar (du hast ${n.current_gold} G${n.sell_value ? ` + ${n.sell_value} G aus dem Verkauf` : ""})</span>`
        : `<span class="gold missing">${price} – es fehlen ${missing} G${n.sell_value ? ` (Verkauf von ${n.sell_item} eingerechnet)` : ""}</span>`;
    }
    if (n.sell_item) {
      gold = `<span class="swap">↺ ${n.sell_item} verkaufen</span> ${gold}`;
    }
    // `now_rel === 100` heisst: der naechste Kauf IST der staerkste Kandidat -
    // und genau das ist die Regel, nicht die Ausnahme. Eine Anzeige dafuer waere
    // reine Tautologie ("der Top-Vorschlag ist der Top-Vorschlag"), darum bleibt
    // die Stelle leer. Ein ABWEICHENDER Wert kommt vor, wenn ein Timing-Gate
    // (Boots-Gate, Defensiv-Zweig) den Pool-Sieger ueberholt; nur dann zeigt der
    // Balken, wie stark dieser Kauf gegenueber der staerksten Karte der Liste ist.
    const nrel = (n.now_rel != null && n.now_rel !== 100) ? relBar(n.now_rel) : "";
    document.getElementById("next").innerHTML =
      `${s.assets_available && n.item_id ? `<img class="iicon" data-item-id="${n.item_id}" src="assets/items/${n.item_id}.png" alt="" onerror="this.remove()">` : ""}
       <span class="itemname">${n.item}</span>
       ${n.tag ? `<span class="${tagClass(n)}">${n.tag}</span>` : ""} ${statBadges(n)} ${nrel} ${gold}
       <span class="muted">${n.reason}</span>`;
  } else {
    document.getElementById("next").innerHTML = r.note
      ? `<span class="muted">${r.note}</span>`
      : '<span class="muted">Build komplett – nichts mehr offen.</span>';
  }

  // Kaufplan-Leiste (Feature 001): hartes Feature-Gate - nur mit Assets UND Plan.
  // Faellt das Gate, wird der ganze Block inkl. "Item-Timeline"-Ueberschrift
  // ausgeblendet (hidden am Container, analog #nogame/#game).
  const plan = r.purchase_plan;
  const planEl = document.getElementById("plan");
  const gate = s.assets_available && plan && plan.length;
  document.getElementById("planblock").hidden = !gate;
  if (gate) {
    planEl.innerHTML = plan.map((st, i) => {
      const cls = ["step", st.final ? "step-final" : "step-component"];
      if (st.upgrade) cls.push("upgrade");
      else if (st.affordable) cls.push("afford");
      const title = st.upgrade
        ? `${esc(st.name)} · Quest-Upgrade – kostenlos`
        : `${esc(st.name)} · ${st.cost} G`;
      const chev = i > 0 ? `<span class="chevron">›</span>` : "";
      return `${chev}<div class="${cls.join(" ")}" title="${title}">
        <img data-item-id="${st.item_id}" src="assets/items/${st.item_id}.png" alt="" onerror="this.remove()"></div>`;
    }).join("");
  } else {
    planEl.innerHTML = "";
  }

  document.getElementById("confidence").innerHTML =
    (r.confidence && r.confidence !== "rich" && r.confidence_note)
      ? `<span class="badge">Basis-Empfehlung</span>
         <span class="muted">${r.confidence_note}</span>`
      : "";

  document.getElementById("stanceline").innerHTML =
    `<span class="stance ${r.stance}">${r.stance}</span>
     <span class="muted"> ${r.stance_reason}
     (Datenbasis: ${r.knowledge_games} High-Elo-Spiele)</span>`
    + (r.stance_note ? `<div class="muted" style="font-size:0.85em">${r.stance_note}</div>` : "");

  // Die Engine liefert items[] bereits gewichtet sortiert (Pool-Score) - hier
  // wird nur noch gefiltert und getrennt:
  // 1. Der Next-Sieger steht oben gross und bleibt fuer die Messung in items[]
  //    (replay_candidates) - in der Liste waere er eine reine Dopplung.
  // 2. Vor der ersten Karte ohne Pool-Score kommt ein gedaempfter Trenner:
  //    Boots/Klassen-Fallback/Anti-Heal sind mit der Gewichtung nicht
  //    vergleichbar (`pool === false`; alte Payloads ohne Feld -> kein Trenner).
  //    Er kommt NUR, wenn vorher wirklich gewichtete Karten standen - sonst
  //    truege er nichts ab (Legacy-Modus ohne Pool-Scores, Support-Endwahl, oder
  //    wenn der einzige Pool-Eintrag der ausgeblendete Sieger war).
  // 3. Die Karten des festen Listen-Kopfs (`head`, Core + Boots in gelernter
  //    Bau-Reihenfolge) loesen den Trenner NIE aus: sie stehen vor der
  //    gewichteten Gruppe, auch wenn einzelne von ihnen keinen Pool-Score haben
  //    (Alternative, Comp-Hinweis) - der Trenner gehoert vor die erste Karte
  //    ohne Score, die NICHT zum Kopf gehoert.
  const nextItem = r.next ? r.next.item : null;
  let poolSeen = false, sepDone = false;
  document.getElementById("recs").innerHTML = r.items
    .filter(i => i.item !== nextItem)
    .map(i => {
      let sep = "";
      if (i.pool) poolSeen = true;
      else if (poolSeen && !sepDone && !i.head) {
        sepDone = true;
        sep = `<div class="sep">Weitere Optionen</div>`;
      }
      // Reihenfolge: kind | Icon | Name | Kaufstaerke | Zweck | Stats | Core/Klasse
      // | Grund. Die Kaufstaerke steht direkt hinter dem Namen (fixe min-width),
      // weil sie am Zeilenende hinter den variabel vielen Stat-Badges auf jeder
      // Karte woanders begann - untereinander lesbar war da nichts.
      // Karten OHNE Kaufstaerke (Boots, Klassen-Fallback, Anti-Heal unter dem
      // Trenner) bekommen einen unsichtbaren Platzhalter, sonst rutschen ihre
      // Zweck-Badges aus der Spalte (gleiches Muster wie beim Zweck-Badge selbst).
      return `${sep}<div class="card${i.alternative ? " alt" : ""}"><span class="kind">${i.kind}</span>
     ${s.assets_available && i.item_id ? `<img class="iicon" data-item-id="${i.item_id}" src="assets/items/${i.item_id}.png" alt="" onerror="this.remove()">` : ""}
     <span class="item">${i.item}</span>
     ${i.now_rel != null ? relBar(i.now_rel) : `<span class="nowrel" style="visibility:hidden">-</span>`}
     ${i.tag ? `<span class="${tagClass(i)}">${i.tag}</span>` : `<span class="tag" style="visibility:hidden">-</span>`}
     ${statBadges(i)}
     ${i.kind === "core" ? `<span class="core-badge" title="Teil des gelernten Core-Builds">Core</span>` : ""}
     ${i.source === "class" ? `<span class="src-class" title="aus Klassen-Daten (Fallback bei duenner Datenlage)">Klasse</span>` : ""}
     <span class="muted">${i.reason}</span></div>`;
    }).join("")
    // Leere Liste: seit der Regel "nur plausible naechste Kaeufe" kann das auch
    // FRUEH passieren (alles andere ist erst spaeter dran, und der einzige
    // Vorschlag steht schon oben gross) - dann waere "Build komplett" schlicht
    // falsch. Der Fall haengt daran, ob es ueberhaupt noch ein echtes Item gibt.
    || (r.next && r.next.kind !== "consumable"
        ? '<div class="muted">Nur der Vorschlag oben steht gerade an – '
          + 'Karten für spätere Käufe blendet die Liste aus.</div>'
        : '<div class="muted">Keine offenen Empfehlungen – Build komplett.</div>');

  const spikes = {};
  (r.spike_warnings || []).forEach(w => { spikes[w.name] = w; });
  document.getElementById("enemies").innerHTML =
    s.enemies.map(e => enemyCard(e, spikes[e.name])).join("");
}

let REFRESH_MS = 60000;   // Default; der Server liefert app.refresh_seconds aus config.yml mit
let nextRefreshAt = Date.now() + REFRESH_MS;

async function refresh() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spin");
  try {
    const resp = await fetch("/api/state");
    render(await resp.json());
  } catch (err) { /* Server weg -> beim naechsten Tick erneut versuchen */ }
  finally { btn.classList.remove("spin"); }
  nextRefreshAt = Date.now() + REFRESH_MS;
}

// Delegierter Listener statt Inline-onchange (Fix Apostroph-Champions): am
// Container registriert, ueberlebt jedes innerHTML-Neurendern der Karten.
document.getElementById("enemies").addEventListener("change", ev => {
  const sel = ev.target.closest("select.prio");
  if (sel) setPriority(sel.dataset.champion, sel.value);
});

// --- Item-Tooltip (Hover ueber ein Item-Icon) -------------------------------
// Zeigt die englische Data-Dragon-Beschreibung (Name, Preis, Kurztext, Stats/
// Passiven/Aktiven) - dieselbe Quelle, die auch die Engine liest, also gibt es
// keinen zweiten Wahrheitsstand ueber ein Item.

// Riot-Markup -> CSS-Klasse. Leerer Wert = reiner Container, dessen Tags
// verschwinden, waehrend der Inhalt bleibt (<mainText>, <font color=...>).
// Alles, was hier NICHT steht, wird spurlos entfernt: lieber ein Tag zu wenig
// gerendert als fremdes Markup ins DOM lassen.
const TT_TAGS = {
  maintext: "", font: "",
  stats: "tt-stats", attention: "tt-attention", rules: "tt-rules",
  flavortext: "tt-rules",
  passive: "tt-passive", active: "tt-active",
  keyword: "tt-keyword", keywordmajor: "tt-keyword", keywordstealth: "tt-keyword",
  spellname: "tt-keyword", unique: "tt-keyword", raritygeneric: "tt-keyword",
  raritylegendary: "tt-legendary", raritymythic: "tt-legendary",
  magicdamage: "tt-magic", scaleap: "tt-magic", scalemana: "tt-magic",
  physicaldamage: "tt-phys", scalead: "tt-phys", scalelethality: "tt-phys",
  attackspeed: "tt-phys", onhit: "tt-phys",
  truedamage: "tt-true",
  healing: "tt-heal", lifesteal: "tt-heal", omnivamp: "tt-heal",
  scalehealth: "tt-heal", health: "tt-heal",
  shield: "tt-shield",
  status: "tt-status", speed: "tt-status", scalelevel: "tt-status",
  scalearmor: "tt-status", scalemr: "tt-status", gold: "tt-status",
};

// Tag-Erkennung NACH dem Escapen: aus "<passive>" ist da "&lt;passive&gt;"
// geworden. Der Attribut-Teil wird mitgefressen und weggeworfen (nur der
// Tag-Name entscheidet) - er landet nie im erzeugten HTML.
const TT_TAG_RE = /&lt;(\/?)([a-zA-Z][a-zA-Z0-9]*)(?:(?!&gt;|&lt;)[\s\S])*&gt;/g;

// Riots Beschreibungstext in sicheres Anzeige-HTML uebersetzen.
// Reihenfolge ist der ganze Sicherheitstrick: ERST alles escapen (danach kann
// aus dem API-Text kein Element mehr entstehen), DANN nur die bekannte
// Whitelist wieder zu eigenen <span>/<br> aufwerten. Kein Roh-Text aus der API
// geht je ungefiltert ins DOM.
function riotText(desc) {
  let html = esc(desc);
  html = html.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  html = html.replace(/&lt;li&gt;/gi, "<br>&bull; ")
             .replace(/&lt;\/li&gt;/gi, "");
  return html.replace(TT_TAG_RE, (_m, slash, tag) => {
    const cls = TT_TAGS[tag.toLowerCase()];
    if (cls === undefined || cls === "") return "";   // unbekannt/Container -> weg
    return slash ? "</span>" : `<span class="${cls}">`;
  });
}

// item_id -> API-Antwort. Auch `found:false` wird gecacht: sonst feuert jeder
// Hover ueber dasselbe unbekannte Item einen neuen Request.
const TT_CACHE = new Map();
let ttCurrent = null;   // Item-ID, ueber der die Maus gerade steht (null = keine)

function ttEl() { return document.getElementById("tooltip"); }

function ttHide() {
  ttCurrent = null;
  ttEl().hidden = true;
}

// Am Cursor ausrichten und am Viewport klemmen: ohne das Klemmen liefe der
// Tooltip an der rechten/unteren Kante aus dem Bild und waere unlesbar.
function ttPlace(x, y) {
  const el = ttEl(), pad = 16, edge = 8;
  const r = el.getBoundingClientRect();
  let left = x + pad, top = y + pad;
  if (left + r.width > window.innerWidth - edge) {
    left = Math.max(edge, x - pad - r.width);
  }
  if (top + r.height > window.innerHeight - edge) {
    top = Math.max(edge, window.innerHeight - edge - r.height);
  }
  el.style.left = `${left}px`;
  el.style.top = `${top}px`;
}

function ttHtml(d) {
  const combine = (d.gold_base && d.gold_base !== d.gold_total)
    ? ` <span class="tt-rules">(Kombi ${d.gold_base} G)</span>` : "";
  return `<div class="tt-name">${esc(d.name)}</div>
    <div class="tt-gold">${d.gold_total} G${combine}</div>
    ${d.plaintext ? `<div class="tt-plain">${esc(d.plaintext)}</div>` : ""}
    ${d.description ? `<div class="tt-body">${riotText(d.description)}</div>` : ""}`;
}

async function ttShow(id, x, y) {
  const el = ttEl();
  let data = TT_CACHE.get(id);
  if (data === undefined) {
    // Waehrend des Fetches schon etwas zeigen - sonst wirkt der erste Hover tot.
    el.innerHTML = `<span class="tt-rules">&hellip;</span>`;
    el.hidden = false;
    ttPlace(x, y);
    try {
      data = await (await fetch(`/api/item/${encodeURIComponent(id)}`)).json();
    } catch (err) { data = { found: false }; }   // Server weg -> stumm bleiben
    TT_CACHE.set(id, data);
    if (ttCurrent !== id) return;   // Maus ist weitergezogen -> Antwort verwerfen
  }
  if (!data || !data.found) { ttHide(); return; }
  el.innerHTML = ttHtml(data);
  el.hidden = false;
  ttPlace(x, y);
}

// Delegiert am document registriert (gleiche Begruendung wie beim Prio-Listener
// oben): die Icons entstehen bei jedem Refresh per innerHTML neu, direkt an
// ihnen haengende Handler waeren danach weg.
document.addEventListener("mouseover", ev => {
  const icon = ev.target.closest ? ev.target.closest("[data-item-id]") : null;
  if (!icon) return;
  const id = icon.dataset.itemId;
  if (id === ttCurrent) return;
  ttCurrent = id;
  ttShow(id, ev.clientX, ev.clientY);
});

document.addEventListener("mouseout", ev => {
  if (ev.target.closest && ev.target.closest("[data-item-id]")) ttHide();
});

document.addEventListener("mousemove", ev => {
  if (ttCurrent !== null && !ttEl().hidden) ttPlace(ev.clientX, ev.clientY);
});

setInterval(() => {
  const remain = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
  document.getElementById("countdown").textContent = `⟳ in ${remain}s`;
  if (remain === 0) refresh();
}, 1000);
refresh();
</script>
</body>
</html>
