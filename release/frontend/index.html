<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>League Active Game Helper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1319; --card: #1a2029; --border: #2a3342;
    --text: #dbe4f0; --muted: #8494ab; --accent: #4fc3f7;
    --aggressive: #ef7b66; --defensive: #64b5f6; --balanced: #9ccc65;
    /* Vorsprung/Rueckstand in Gold-Differenzen. Bewusst EIGENE Token statt der
       Stance-Farben: --aggressive ist lachsrot und gehoert dem Stance-Badge,
       --minus ist ein warmes Orange, das neben dem Blau als "wir liegen hinten"
       lesbar ist, ohne wie eine Fehlermeldung zu wirken. */
    --plus: #64b5f6; --minus: #ffb74d;
    /* "Gefuettert": derselbe Rotton wie die dringende Spike-Warnung
       (.spike.high) - beides sagt "dieser Gegner ist JETZT das Problem", das
       darf nicht in zwei Rottoenen erscheinen. */
    --fed: #ff5252;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 20px 0 8px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: .85rem; }
  #refreshBtn { background: var(--card); color: var(--accent);
                border: 1px solid var(--border); border-radius: 50%;
                width: 30px; height: 30px; font-size: 1rem; cursor: pointer;
                line-height: 1; }
  #refreshBtn:hover { border-color: var(--accent); }
  #refreshBtn.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 12px 14px; }
  /* Du-Zeile: gedaempfter EINZEILER statt Ueberschrift + Karte. Der Block sagt
     nichts, was die Empfehlung nicht schon weiss - er darf ihr deshalb keinen
     Platz mehr wegnehmen. Bei langer Itemliste wird abgeschnitten statt
     umzubrechen (eine zweite Zeile waere genau der Platz, der gespart werden
     soll); der volle Text haengt im title. */
  .meline { color: var(--muted); font-size: .85rem; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stance { display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-weight: 600; font-size: .8rem; color: #10141a; }
  .stance.aggressive { background: var(--aggressive); }
  .stance.defensive  { background: var(--defensive); }
  .stance.balanced   { background: var(--balanced); }
  #next.card { border-color: var(--accent); margin-bottom: 4px;
               display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  #next .itemname { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  #next .gold { font-variant-numeric: tabular-nums; font-weight: 600; }
  #next .gold.ok { color: var(--balanced); }
  #next .gold.missing { color: var(--aggressive); }
  /* Tausch-Karte (X gegen Y): eine Zeile "Tausche [X] ▸ [Y]", die den normalen
     Next-Inhalt ERSETZT. Sie erscheint erst, wenn alle sechs Slots final belegt
     sind - vorher ist an dieser Stelle nichts anders (Nutzer-Entscheid
     2026-09-05, "kein Vorgriff"). Eigener Flex-Kontext, damit die beiden Icons
     mittig zu den Namen stehen; das Aussen-Layout von #next bleibt baseline. */
  #next .swap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #next .swaplabel { font-size: .72rem; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .06em; color: var(--muted); }
  /* Das Opfer traegt die Warnfarbe, das Kauf-Item bleibt im Accent der Karte -
     so ist ohne Lesen klar, welches der beiden Bilder verschwindet. */
  #next .swap .sell { color: var(--aggressive); }
  #next .swap .arrow { font-size: 1.25rem; font-weight: 700; color: var(--muted); }
  /* Kaufplan-Leiste (Feature 001): Icon-Schritte direkt unter dem Next-Block. */
  #plan { display: flex; align-items: center; gap: 4px; margin: 6px 0 2px;
          overflow-x: auto; padding: 2px 0 6px; }
  #plan .step { flex: none; border-radius: 8px; background: #10151d;
                border: 2px solid transparent; padding: 3px; line-height: 0; }
  #plan .step img { display: block; border-radius: 6px; }
  #plan .step-final img { width: 68px; height: 68px; }      /* -10% vom 64px Next-Icon */
  #plan .step-component img { width: 45px; height: 45px; }  /* ~-30% -> klar kleiner als Finals */
  #plan .step.afford { border-color: #f0c419;               /* goldener Ring, kraeftiger */
                       box-shadow: 0 0 9px rgba(240, 196, 25, .7); }
  #plan .step.upgrade { border-style: dashed; border-color: var(--balanced); }
  #plan .chevron { flex: none; color: var(--muted); font-weight: 700;
                   font-size: 1.1rem; }
  /* Spielstil-Regler (plan_spielstil.md): bewusste NUTZER-Vorgabe "wie tanky
     bzw. wie sehr auf Schaden soll die Empfehlung schauen". Sitzt in der
     KOPFZEILE (rechts vom Refresh-Knopf), weil er auf alles darunter wirkt
     (Next, Kaufplan, gewichtete Liste) - zwischen den Bl&ouml;cken sah er aus
     wie eine Einstellung nur f&uuml;r den n&auml;chsten Block. Mittig ueber
     `margin: 0 auto`, also im freien Platz der Zeile: eine absolute Zentrierung
     (position:absolute) w&uuml;rde sich bei normalen Fensterbreiten ueber die
     Meta-Zeile schieben, im Fluss bricht der Block statt dessen sauber in die
     n&auml;chste Kopfzeilen-Reihe um (.top hat flex-wrap). Dezent gehalten - er
     ordnet die Empfehlung um, er ist kein zweites Ranking. Farbwelt aus der
     Stance (defensiv-blau links, gr&uuml;n neutral, aggressiv-rot rechts),
     damit "links = halten, rechts = zuschlagen" ohne Legende lesbar ist. */
  /* [hidden] explizit auf display:none pinnen (gleiche Falle wie beim
     Report-Banner): der Regler ist nur waehrend eines Spiels sichtbar, weil der
     Server ihn bei jedem neuen Spiel auf Neutral zuruecksetzt - eine
     Vorab-Einstellung ohne Spiel waere wirkungslos. */
  #styleblock[hidden] { display: none; }
  #styleblock { flex: 0 0 auto; margin: 0 auto; max-width: 100%; }
  .stylerow { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .stylecap { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
              color: var(--muted); padding-top: 2px; }
  /* Kompakt genug fuer EINE Kopfzeilen-Zeile: mit Beschriftung ~330 px breit. */
  .stylectl { width: 260px; max-width: 100%; }
  #styleRange { -webkit-appearance: none; appearance: none; display: block;
                width: 100%; height: 6px; margin: 4px 0 0; border-radius: 3px;
                border: 1px solid var(--border); cursor: pointer;
                background: linear-gradient(90deg, var(--defensive) 0%,
                            var(--balanced) 50%, var(--aggressive) 100%); }
  #styleRange:focus { outline: none; }
  #styleRange:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  /* Thumb doppelt: WebKit/Blink und Gecko teilen sich keine Pseudo-Elemente,
     und ein zusammengefasster Selektor wuerde von beiden verworfen. */
  #styleRange::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
                background: var(--text); border: 2px solid var(--card);
                box-shadow: 0 0 5px rgba(0, 0, 0, .7); }
  #styleRange::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;
                cursor: pointer; background: var(--text);
                border: 2px solid var(--card);
                box-shadow: 0 0 5px rgba(0, 0, 0, .7); }
  /* Die f&uuml;nf Beschriftungen unter den Rastpunkten: gleiche Breite wie der
     Regler, f&uuml;nf gleich breite Spalten - so sitzt jede Beschriftung unter
     ihrer Stufe. Die aktive Stufe wird hervorgehoben (.on), der Rest bleibt
     gemuted. */
  .styleticks { display: grid; grid-template-columns: repeat(5, 1fr);
                font-size: .68rem; color: var(--muted); margin-top: 4px; }
  .styleticks span { text-align: center; cursor: default; }
  .styleticks span:first-child { text-align: left; }
  .styleticks span:last-child { text-align: right; }
  .styleticks span.on { color: var(--text); font-weight: 700; }
  /* Die Erklaerzeile bleibt im INHALT (nicht in der Kopfzeile): sie ist ein
     ganzer Satz und wuerde die einzeilige Kopfzeile sprengen; ausserdem erklaert
     sie genau die Bloecke, ueber denen sie steht. Die Raender uebernehmen den
     Abstand, den frueher der Regler-Block hatte - ist der Text leer, kollabieren
     sie mit dem Rand der folgenden Ueberschrift, es entsteht keine Luecke. */
  #styleNote { margin: 20px 0 4px; }
  #confidence { margin: 2px 0 6px; }
  #confidence .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-weight: 600; font-size: .72rem; background: var(--aggressive);
            color: #10141a; margin-right: 8px; }
  #recs .card { margin-bottom: 8px; display: flex; gap: 12px; align-items: baseline; }
  #recs .card.alt { opacity: .68; }   /* zweite Boots-Option (Sichtbarkeit) */
  /* Schnitt zwischen der gewichteten Liste (pool: true) und allem, was auf einer
     eigenen Score-Skala laeuft (Boots, Klassen-Fallback, Anti-Heal ...). Bewusst
     gedaempft: der Block ist eine Ergaenzung, kein zweites Ranking. */
  #recs .sep { color: var(--muted); font-size: .72rem; font-weight: 600;
               text-transform: uppercase; letter-spacing: .08em;
               border-top: 1px solid var(--border); margin: 16px 0 8px;
               padding-top: 8px; }
  #recs .item { font-weight: 600; min-width: 180px; }
  #recs .kind { font-size: .7rem; text-transform: uppercase; color: var(--accent); min-width: 80px; }
  .iicon { width: 56px; height: 56px; border-radius: 6px; flex: none; align-self: center; }
  #next .iicon { width: 64px; height: 64px; }
  /* Zweck-Badge ("wogegen": Anti-Tank, Anti-AD, ...). Die Grundklasse ist
     NEUTRAL (Outline) - gefuelltes Accent-Blau kollidierte mit der Stance-
     Farbwelt (--defensive). Gefuellt wird nur ueber die Achse: .off = das Item
     schlaegt zu (gruen), .def = das Item haelt aus (defensiv-blau). */
  .tag { display: inline-block; font-size: .68rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px;
         border-radius: 6px; border: 1px solid var(--border); color: var(--muted);
         background: transparent; white-space: nowrap; }
  #recs .tag { min-width: 96px; text-align: center; flex: none; }
  .tag.off { background: var(--balanced); border-color: var(--balanced); color: #10141a; }
  .tag.def { background: var(--defensive); border-color: var(--defensive); color: #10141a; }
  /* Natur-Badges ("was es dir gibt": +HP/+Ruestung/+MR) - Outline in der
     defensiven Farbe, damit die defensive Haelfte von Hybriden sichtbar wird. */
  .statbadge { display: inline-block; font-size: .62rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--defensive);
         color: var(--defensive); background: transparent; white-space: nowrap; }
  .src-class { display: inline-block; font-size: .64rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--border); color: var(--muted);
         white-space: nowrap; }
  /* CORE-Badge: markiert das Item aus dem gelernten Core-Build. */
  .core-badge { display: inline-block; font-size: .64rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px;
         border-radius: 6px; border: 1px solid var(--accent); color: var(--accent);
         white-space: nowrap; }
  /* Kaufstaerke relativ zur Top-Empfehlung (nur Pool-Kandidaten): schmaler
     Balken + Zahl, 100 % = staerkstes Kaufsignal. Bewusst dezent in der
     Muted-Farbwelt - die Zahl ordnet ein, sie ist kein zweites Ranking.
     Gross genug zum Ablesen (.85rem): bei .66rem war die Zahl auf dem Monitor
     im Spiel nicht mehr zu erkennen. */
  .nowrel { display: inline-block; font-size: .85rem; font-weight: 700;
         color: var(--muted); font-variant-numeric: tabular-nums;
         white-space: nowrap; }
  .nowrel .track { display: inline-block; vertical-align: middle;
         width: 56px; height: 6px; margin-right: 6px; border-radius: 3px;
         background: #10151d; border: 1px solid var(--border);
         overflow: hidden; }
  .nowrel .fill { display: block; height: 100%; border-radius: 3px;
         background: var(--balanced); }
  /* In der Liste steht der Balken DIREKT hinter dem Itemnamen (der hat
     min-width, also alignen die Balken untereinander). Vorher stand er am Ende
     hinter den Stat-Badges - und weil je Karte 0, 1 oder 2 Stat-Badges kommen,
     rutschte jeder Balken auf eine andere x-Position: nichts war vergleichbar.
     Die feste Mindestbreite haelt die nachfolgenden Zweck-Badges in einer
     Spalte, auch bei Karten ohne Kaufstaerke (unsichtbarer Platzhalter). */
  #recs .nowrel { min-width: 112px; flex: none; }
  .spike { font-size: .78rem; font-weight: 600; color: var(--aggressive);
           margin: 2px 0; }
  .spike.high { color: #ff5252; }
  /* Team-Gold-Zeile: Item-Gold-Differenz des Teams und je Rolle, EINE kompakte
     Zeile ohne eigene Ueberschrift. Sie ordnet die Lage ein und ist kein
     eigener Block - eine h2 wuerde ihr das Gewicht der Empfehlungsbloecke
     geben. tabular-nums, damit die Zahlen zwischen zwei Refreshes nicht
     seitlich springen. */
  .teamgold { margin-top: 14px; font-size: .88rem;
              font-variant-numeric: tabular-nums; }
  .teamgold .cap { color: var(--muted); }
  .teamgold .tgsep { color: var(--muted); margin: 0 8px; }
  .teamgold .plus { color: var(--plus); font-weight: 600; }
  .teamgold .minus { color: var(--minus); font-weight: 600; }
  /* Gleichstand und fehlende Rolle sind KEINE Aussage - sie bleiben gedaempft,
     damit die farbigen Zahlen die einzigen Blickfaenge der Zeile sind. */
  .teamgold .zero { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .enemy .name { font-weight: 600; display: flex; justify-content: space-between; }
  /* K/D/A steht jetzt ausgeschrieben in der Zeile (die blosse KDA verriet nicht,
     ob jemand gefuettert ist) - tabular-nums, damit die Karten zwischen zwei
     Refreshes nicht seitlich zappeln. */
  .enemy .profile { color: var(--accent); font-size: .8rem;
                    font-variant-numeric: tabular-nums; }
  /* Gefuetterter Gegner: die Karte selbst traegt den Akzent, damit man sie im
     Raster findet, ohne jede Zahl zu lesen. Bewusst nur Rand + dezenter Schein -
     eine eingefaerbte Karte wuerde die Prio-Auswahl darunter erschlagen. */
  .enemy.fed { border-color: var(--fed);
               box-shadow: 0 0 10px rgba(255, 82, 82, .35); }
  .fedchip { display: inline-block; margin-right: 6px; padding: 1px 7px;
             border-radius: 6px; background: var(--fed); color: #10141a;
             font-size: .62rem; font-weight: 800; text-transform: uppercase;
             letter-spacing: .06em; vertical-align: middle; }
  /* Anti-Kandidaten: Chips im Stil der Stat-Badges (Outline in der defensiven
     Farbe). Sie zeigen NUR, was ohnehin in der Empfehlungsliste steht - kein
     zweites Ranking, deshalb kein gefuelltes Badge, das mit den Tags der Liste
     um Aufmerksamkeit konkurrieren wuerde. */
  .enemy .anti { margin-top: 6px; font-size: .78rem; }
  .enemy .anti .cap { color: var(--muted); }
  .antichip { display: inline-block; margin: 3px 3px 0 0; padding: 1px 7px;
              border-radius: 6px; border: 1px solid var(--defensive);
              color: var(--defensive); background: transparent;
              font-size: .7rem; font-weight: 700; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: #345; margin: 6px 0;
         overflow: hidden; display: flex; }
  .bar .ad { background: #ef7b66; height: 100%; }
  .bar .ap { background: #7e97f7; height: 100%; }
  .threat { font-variant-numeric: tabular-nums; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 2px 6px; margin-top: 6px; }
  #nogame { margin-top: 40px; text-align: center; color: var(--muted); }
  /* "Match-Report bereit"-Button (Endscreen): grosser, auffaelliger Link auf
     den fertigen Post-Game-Report. Wird nur ausserhalb des laufenden Spiels
     gezeigt (no_game/post_game) - im Spiel hat die Live-Ansicht Vorrang. */
  /* WICHTIG: display:block wuerde das UA-[hidden]-display:none ueberschreiben,
     dann waere der Banner IMMER sichtbar (leerer Klick-Balken vor dem ersten
     Report). Daher [hidden] explizit auf display:none pinnen. */
  #reportBanner[hidden] { display: none; }
  #reportBanner { display: block; text-decoration: none; margin: 18px 0;
    padding: 16px 22px; border-radius: 12px; text-align: center;
    font-size: 1.15rem; font-weight: 700; color: #10141a; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--balanced));
    box-shadow: 0 0 16px rgba(79, 195, 247, .45);
    transition: transform .1s ease, box-shadow .1s ease; }
  #reportBanner:hover { transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(79, 195, 247, .65); }
  #reportBanner .report-badge { display: inline-block; margin-left: 12px;
    padding: 2px 12px; border-radius: 20px; vertical-align: middle;
    font-size: .78rem; font-weight: 600; background: rgba(16, 20, 26, .28); }
  /* Ladebalken des laufenden Report-Neubaus, direkt unter dem Banner. Bewusst
     DEZENT (duenner Strich + gemutete Zeile): das Banner bleibt der Blickfang,
     der Balken sagt nur "es arbeitet noch, so weit ist es".
     Die Klassen .bar/.fill heissen genauso wie in history.html, damit beide
     Seiten wie EIN System aussehen - hier aber unter #reportProgress gehaengt,
     weil .bar auf dieser Seite schon dem AD/AP-Split der Gegnerkarten gehoert.
     [hidden] wieder explizit pinnen (gleiche Falle wie beim Banner: eigenes
     display wuerde das UA-display:none schlagen).
     Negativer oberer Rand: er wird mit dem 18px-Rand des Banners verrechnet,
     damit Balken und Banner als EIN Block zusammenstehen. */
  #reportProgress[hidden] { display: none; }
  #reportProgress { display: block; margin: -8px 0 18px; }
  #reportProgress .bar { display: block; height: 6px; border-radius: 3px;
    background: var(--border); overflow: hidden; }
  #reportProgress .fill { display: block; height: 100%; border-radius: 3px;
    background: var(--accent); transition: width .3s ease; }
  /* Unbestimmte Phase (Warten auf die Riot-Indexierung): es gibt nichts zu
     zaehlen, also laeuft ein Streifen durch, statt einen Fortschritt zu
     behaupten, den niemand kennt. */
  #reportProgress .bar.indeterminate .fill {
    animation: progslide 1.5s ease-in-out infinite; }
  @keyframes progslide { from { margin-left: -35%; } to { margin-left: 100%; } }
  #reportProgress .plabel { color: var(--muted); font-size: .8rem;
    margin-top: 4px; }
  /* Link auf die Match-History-Seite: bewusst DEZENT (Sekundaer-Button, kein
     Verlauf/Glow) - er steht immer unten und darf dem Report-Banner nicht die
     Aufmerksamkeit nehmen. Immer sichtbar, also kein [hidden]-Handling noetig. */
  #historyLink { display: inline-block; margin: 34px 0 6px; padding: 9px 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--muted); text-decoration: none; font-size: .9rem;
    font-weight: 600; }
  #historyLink:hover { border-color: var(--accent); color: var(--accent); }
  /* Item-Tooltip (Hover ueber ein Item-Icon): EIN globales Element, das per
     position:fixed an die Maus gehaengt wird. pointer-events:none ist wichtig -
     sonst schoebe sich der Tooltip unter den Cursor, loeste dort ein mouseout
     auf dem Icon aus und flackerte. [hidden] explizit pinnen, weil die eigenen
     display-Regeln sonst das UA-Default ueberschreiben (gleiche Falle wie beim
     Report-Banner). */
  #tooltip[hidden] { display: none; }
  #tooltip { position: fixed; left: 0; top: 0; z-index: 100; display: block;
    max-width: 380px; pointer-events: none;
    background: var(--card); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font-size: .82rem; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  #tooltip .tt-name { font-weight: 700; font-size: .95rem; color: var(--accent); }
  #tooltip .tt-gold { font-weight: 600; font-variant-numeric: tabular-nums;
    color: #f0c419; }
  #tooltip .tt-plain { color: var(--muted); font-style: italic; margin-top: 4px; }
  #tooltip .tt-body { margin-top: 8px; border-top: 1px solid var(--border);
    padding-top: 8px; }
  /* Riot-Markup-Klassen: die Beschreibung aus Data Dragon traegt eigene Tags
     (<passive>, <magicDamage>, ...). Sie werden NICHT roh ins DOM gelassen,
     sondern nach dem Escapen ueber eine Whitelist in genau diese Klassen
     uebersetzt (s. riotText). Farbwelt bewusst nah am Spiel-Tooltip. */
  #tooltip .tt-passive { font-weight: 700; color: var(--accent); }
  #tooltip .tt-active { font-weight: 700; color: #f0c419; }
  #tooltip .tt-attention { font-weight: 700; color: var(--text); }
  #tooltip .tt-keyword { font-weight: 600; color: var(--accent); }
  #tooltip .tt-stats { color: var(--text); }
  #tooltip .tt-rules { color: var(--muted); font-style: italic; font-size: .95em; }
  #tooltip .tt-magic { color: #7e97f7; }
  #tooltip .tt-phys { color: var(--aggressive); }
  #tooltip .tt-true { color: #e8dfc8; }
  #tooltip .tt-heal { color: var(--balanced); }
  #tooltip .tt-shield { color: #cfd8dc; }
  #tooltip .tt-status { color: #ffd54f; }
  #tooltip .tt-legendary { color: #e0b465; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <h1>League Active Game Helper</h1>
    <span class="muted" id="meta"></span>
    <span class="muted" id="countdown"></span>
    <button id="refreshBtn" title="Jetzt aktualisieren" onclick="refresh()">&#10227;</button>

    <!-- Spielstil-Regler: steht STATISCH hier (und nicht in einem per innerHTML
         neu gebauten Container), damit der direkt registrierte Listener jedes
         Neurendern ueberlebt und der Schieber beim Ziehen nicht wegspringt.
         Sichtbarkeit uebernimmt render() mit derselben Bedingung wie fuer
         #game - ohne laufendes Spiel gibt es nichts zu gewichten. -->
    <div id="styleblock" hidden>
      <div class="stylerow">
        <span class="stylecap">Spielstil</span>
        <div class="stylectl">
          <input type="range" id="styleRange" min="1" max="5" step="1" value="3"
                 aria-label="Spielstil: 1 = tanky, 3 = neutral, 5 = maximal Schaden">
          <div class="styleticks" id="styleTicks">
            <span title="Hard defensive / tanky (HP-Fokus)">Tank</span>
            <span title="Tanky, aber aggressiver">Tanky</span>
            <span title="Neutral &ndash; die normale High-Elo-Empfehlung (Default)">Neutral</span>
            <span title="Leicht aggressiv">Aggressiv</span>
            <span title="I can carry &ndash; maximal Schaden">Carry</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <a id="reportBanner" href="#" target="_blank" rel="noopener" hidden></a>

  <!-- Ladebalken des Report-Neubaus: eigener Block NEBEN dem Banner, nicht
       darin - im <a> waere er Teil der Klickflaeche. Inhalt baut
       renderReport(), sichtbar nur solange der Server einen Snapshot liefert. -->
  <div id="reportProgress" hidden></div>

  <div id="nogame" hidden>Kein aktives Spiel gefunden – warte auf Spielstart …</div>

  <div id="game" hidden>
    <!-- Du-Zeile: bewusst ohne Ueberschrift und ohne Karte. Alles Wesentliche
         (Rolle, KDA, ausgegebenes Gold, Items) passt in eine Zeile; das volle
         Profil steht ohnehin im YAML-Export. -->
    <div id="me" class="meline"></div>

    <!-- Erklaerzeile zum Reglerstand (der Regler selbst sitzt in der Kopfzeile):
         bleibt hier im Inhalt, direkt ueber den Bloecken, deren Abweichung von
         der Datenwahrheit sie begruendet. Wird nur gefuellt, wenn die Engine
         etwas zu sagen hat - bei Stufe 3 bleibt sie leer. -->
    <div id="styleNote" class="muted"></div>

    <h2>N&auml;chstes Item</h2>
    <div id="confidence"></div>
    <div class="card" id="next"></div>

    <div id="planblock" hidden>
      <h2>Item-Timeline</h2>
      <div id="plan"></div>
    </div>

    <h2>Situational</h2>
    <div id="stanceline" style="margin-bottom:8px"></div>
    <div id="recs"></div>

    <!-- Team-Gold: steht zwischen der Empfehlungsliste und den Gegnern, weil sie
         genau dazwischen vermittelt - "wie steht mein Team gegen deren Team da"
         ist die Bruecke von "was kaufe ich" zu "gegen wen". -->
    <div id="teamgold" class="teamgold"></div>

    <h2>Gegner (nach Threat sortiert)</h2>
    <div class="grid" id="enemies"></div>
  </div>

  <!-- Immer sichtbar, ganz unten: Einstieg in die Match-History-Seite. -->
  <div><a id="historyLink" href="history.html">&#128220; Match History Reports</a></div>

  <!-- EIN globaler Item-Tooltip fuer alle Icons (Next, Liste, Timeline). Ein
       Element pro Icon waere Verschwendung und muesste bei jedem Neurendern
       mitwandern; dieses hier lebt ausserhalb der neu gebauten Container. -->
  <div id="tooltip" hidden></div>

<script>
const PRIOS = ["low", "medium", "high", "urgent"];

// HTML-Escaping fuer interpolierte API-Strings (v.a. Champion-Namen). Ohne das
// brechen Apostroph-Champions (Kha'Zix, Cho'Gath, Vel'Koz, K'Sante ...) das
// Markup bzw. inline-Handler auf.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Gold-Zahlen ueberall mit Tausenderpunkt: "18350 G" war im Spiel, mit einem
// Blick auf den zweiten Monitor, nicht als "18k" zu erfassen - die Ziffernzahl
// musste man zaehlen. EIN Formatter fuer alle Stellen (Du-Zeile, Gegnerkarten,
// Team-Gold), damit dieselbe Zahl nirgends anders aussieht.
const GOLD_FMT = new Intl.NumberFormat("de-DE");

function fmtGold(n) {
  return Number.isFinite(n) ? GOLD_FMT.format(n) : String(n ?? "");
}

// Differenzen tragen IMMER ein Vorzeichen: ohne "+" liest sich "1.000" wie ein
// Absolutwert, und die Richtung ist hier die ganze Aussage. Minus als echtes
// U+2212 (Minuszeichen), weil der ASCII-Bindestrich neben Ziffern zu kurz und
// zu tief sitzt. Kein Wert (Rolle auf einer Seite unbekannt) -> Gedankenstrich,
// keine erfundene Null.
function fmtDiff(n) {
  if (!Number.isFinite(n)) return "–";
  const sign = n > 0 ? "+" : n < 0 ? "−" : "";
  return sign + fmtGold(Math.abs(n));   // EIN Formatweg fuer alle Gold-Zahlen
}

// Farbe des Zweck-Badges kommt aus der ACHSE (rec.tag_axis), nicht mehr aus dem
// Tag-Text: "Anti-Tank" ist ein OFFENSIVES Item (Void Staff), "Anti-AD" ein
// defensives - am Wort "Anti-" waren beide nicht zu unterscheiden.
// hybrid zaehlt als offensiv (es schlaegt zu), die Stat-Badges zeigen daneben,
// was das Item defensiv mitbringt. Ohne Achse (Consumables, alte Payloads):
// neutrales Outline-Badge.
function tagClass(rec) {
  const ax = rec && rec.tag_axis;
  if (ax === "off" || ax === "hybrid") return "tag off";
  if (ax === "def") return "tag def";
  return "tag";
}

// Natur-Badges ("+HP"/"+Ruestung"/"+MR") hinter dem Zweck-Badge.
function statBadges(rec) {
  return ((rec && rec.stats) || [])
    .map(s => `<span class="statbadge">${esc(s)}</span>`).join(" ");
}

// Kaufstaerke-Anzeige (`now_rel`): Balken + Zahl, 100 % traegt der staerkste
// vergleichbare Kandidat. Die Skala ist bewusst RELATIV und kein Anteil an der
// Summe mehr - "19 % jetzt" wurde als Konfidenz gelesen ("nur zu 19 % sicher"),
// obwohl es der Sieger war, und die Zahl hing an der Listenlaenge.
function relBar(v) {
  const w = Math.max(0, Math.min(100, v));
  return `<span class="nowrel" title="Kaufst&auml;rke relativ zur Top-Empfehlung (100 % = st&auml;rkstes Kaufsignal)"
     ><span class="track"><span class="fill" style="width:${w}%"></span></span>${v} %</span>`;
}

async function setPriority(champion, priority) {
  await fetch("/api/priority", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({champion, priority}),
  });
  refresh();
}

// --- Spielstil-Regler -------------------------------------------------------
// Der Server ist die einzige Wahrheit ueber die Stufe (er setzt sie bei jedem
// neuen Spiel auf 3 zurueck), das Frontend spiegelt sie nur. Waehrend der Nutzer
// zieht, darf ein zwischendurch eintreffender Render den Schieber aber nicht
// unter dem Finger wegziehen - dafuer das Flag plus die activeElement-Pruefung
// (deckt auch die Tastaturbedienung ab, die kein pointerdown ausloest).
let styleDragging = false;

function markStyleLevel(level) {
  const ticks = document.getElementById("styleTicks").children;
  for (let i = 0; i < ticks.length; i++) {
    ticks[i].classList.toggle("on", i + 1 === level);
  }
}

async function setPlaystyle(level) {
  await fetch("/api/playstyle", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({level}),
  });
  refresh();
}

// `deathChampion`: der Gegner aus dem Todes-Signal (nur der Champion-Fall) -
// er bekommt dieselbe Anti-Zeile wie ein gefuetterter Gegner.
//
// Die Karte zeigt bewusst KEINE Itemliste des Gegners mehr: die Items stehen im
// Spiel ohnehin im Scoreboard, auf der Karte kosteten sie nur Platz. Und keine
// Todes-Zeile - was aus den Toden folgt, steht in der Anti-Zeile.
function enemyCard(e, spike, deathChampion) {
  const ad = Math.round(e.damage_split.ad * 100);
  const ap = Math.round(e.damage_split.ap * 100);
  const opts = PRIOS.map(p =>
    `<option value="${p}" ${p === e.priority ? "selected" : ""}>${p}</option>`).join("");
  const spikeLine = spike
    ? `<div class="spike ${spike.urgency}" title="Item-Vorsprung">⚡ ${spike.message}</div>`
    : "";
  // Fed-Badge (F4a): EINE Quelle, naemlich das absolute Live-Kriterium des
  // Servers (`is_strongly_fed` mit Hysterese) - keine zweite Schwelle hier.
  // Defensiv gelesen: alte Payloads und die Demo kennen das Feld nicht.
  const fed = !!e.fed_prev_strong;
  const sc = e.scores || {};
  // Anti-Zeile (F2a/A3): ANZEIGE-Regel, kein Ranking - genannt wird nur, was
  // ohnehin schon in der Empfehlungsliste steht (Server: counter_items). Und
  // nur auf den Karten, die es brauchen: gefuetterter Gegner oder der Champion,
  // an dem man staendig stirbt. Ohne Kandidaten erscheint gar nichts.
  const counters = e.counter_items || [];
  const antiLine = (fed || e.name === deathChampion) && counters.length
    ? `<div class="anti"><span class="cap">Gegen ihn in deiner Liste:</span>
      ${counters.map(n => `<span class="antichip">${esc(n)}</span>`).join(" ")}</div>`
    : "";
  return `<div class="card enemy${fed ? " fed" : ""}">
    <div class="name"><span>${esc(e.name)}
      ${e.role ? `<span class="muted">${esc(e.role)}</span>` : ""}</span>
      <span>${fed ? `<span class="fedchip" title="Deutlich vor der Erwartung – Gold und K/D/A">FED</span>` : ""}<span class="threat" title="Absolute Gefährlichkeit (Erwartung nach Spielzeit; inkl. deiner Prio)">⚠ ${e.threat_pct != null ? Math.round(e.threat_pct * 100) + " %" : e.threat_score}</span></span></div>
    ${spikeLine}
    <div class="profile">${esc(e.build_profile)} · ${fmtGold(e.gold_spent)} G · ${esc(sc.kills ?? 0)}/${esc(sc.deaths ?? 0)}/${esc(sc.assists ?? 0)} · KDA ${esc(e.kda)}</div>
    <div class="bar"><div class="ad" style="width:${ad}%"></div>
                     <div class="ap" style="width:${ap}%"></div></div>
    <div class="muted">${ad}% AD / ${ap}% AP</div>
    <label class="muted">Prio:
      <select class="prio" data-champion="${esc(e.name)}">${opts}</select></label>
    ${antiLine}
  </div>`;
}

// --- Team-Gold-Zeile --------------------------------------------------------
// Beschriftung und Reihenfolge folgen der Lane-Reihenfolge, wie man sie im
// Spiel liest (Top -> Jungle -> Mid -> Support -> ADC), NICHT den API-Namen:
// "MIDDLE"/"BOTTOM"/"UTILITY" sagt am Bildschirm niemand.
const TEAMGOLD_ROLES = [["Top", "TOP"], ["Jungle", "JUNGLE"], ["Mid", "MIDDLE"],
                        ["Support", "UTILITY"], ["ADC", "BOTTOM"]];

// Gezeigt wird NUR die Differenz - die Absolutwerte beider Teams stehen zwar im
// Payload (YAML-Nachvollziehbarkeit), sagen beim Kaufen aber nichts: relevant
// ist, ob man vorne oder hinten liegt.
function goldCell(label, v) {
  const cls = v > 0 ? "plus" : v < 0 ? "minus" : "zero";
  return `<span class="cap">${esc(label)}</span> <span class="${cls}">${fmtDiff(v)}</span>`;
}

function teamGoldLine(tg) {
  if (!tg) return "";   // aeltere Payload ohne Feld -> leer statt "0" behaupten
  const roles = tg.roles || {};
  return [goldCell("Team", tg.diff)]
    .concat(TEAMGOLD_ROLES.map(([label, key]) => goldCell(label, roles[key])))
    .join(`<span class="tgsep">|</span>`);
}

// --- Report-Banner + Ladebalken ---------------------------------------------
// EINE Funktion fuer beides: Banner und Balken kommen aus demselben Stueck
// Payload (`postgame_report`) und haengen an derselben Bedingung. Sie wird aus
// zwei Quellen gefuettert - dem normalen /api/state-Refresh und dem
// 3-s-Polling auf /api/postgame/progress; der Mini-Endpunkt kennt die Phase
// nicht, die kommt deshalb als zweites Argument mit (lastPhase).
function renderReport(rep, phase) {
  // "Match-Report bereit"-Button: nur ausserhalb des laufenden Spiels zeigen
  // (Endscreen = no_game/post_game). Waehrend ein Spiel laeuft (in_game) hat die
  // Live-Ansicht Vorrang -> Button ausgeblendet. Link oeffnet in neuem Tab; bei
  // Stufe-2-Aufwertung eine Zusatz-Badge "inkl. Schaden-Analyse".
  const banner = document.getElementById("reportBanner");
  if (rep && rep.url && phase !== "in_game") {
    banner.href = rep.url;
    banner.innerHTML = "📊 Match-Report bereit"
      + (rep.enriched ? '<span class="report-badge">inkl. Schaden-Analyse</span>' : "");
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }

  // Balken nur, solange ein Neubau wirklich laeuft (`progress` gesetzt) - ist
  // er durch, liefert der Server null und die Anzeige faellt auf den blossen
  // Banner zurueck. Die Beschriftung kommt FERTIG vom Server ("Ränge 4/10"),
  // das Frontend formuliert nichts selbst und escaped nur.
  const box = document.getElementById("reportProgress");
  const pr = rep && rep.progress;
  if (pr && phase !== "in_game") {
    // Unbestimmt (Warten auf Riot): der Streifen laeuft, `pct` waere hier nur
    // der eingefrorene Stand von vorher - dann lieber gar keine Zahl zeigen.
    const pct = Math.max(0, Math.min(100, Number(pr.pct) || 0));
    box.innerHTML =
      `<div class="bar${pr.indeterminate ? " indeterminate" : ""}"
         ><span class="fill" style="width:${pr.indeterminate ? 35 : pct}%"></span></div>
       <div class="plabel">${esc(pr.label)}</div>`;
    box.hidden = false;
    startProgressPoll();
  } else {
    box.hidden = true;
    box.innerHTML = "";
  }
}

// Waehrend eines Neubaus reicht der normale Refresh nicht: ein Balken, der alle
// 60 s springt, ist nutzlos. Deshalb eine eigene, kurze Kadenz - aber NUR
// solange etwas laeuft, und auf dem Mini-Endpunkt, der bloss ein Dict unter
// Lock liest (kein Live-Client-Fetch wie /api/state).
const PROGRESS_MS = 3000;
let progressTimer = null;
let lastPhase = null;   // Phase des letzten /api/state - /api/postgame/progress kennt sie nicht

function startProgressPoll() {
  if (progressTimer) return;   // nie zwei Schleifen parallel
  progressTimer = setTimeout(pollProgress, PROGRESS_MS);
}

async function pollProgress() {
  progressTimer = null;
  let rep;
  try {
    rep = await (await fetch("/api/postgame/progress")).json();
  } catch (err) {
    // Server kurz weg -> beim naechsten Tick erneut; der Lauf im Server geht ja
    // weiter, ein Abbruch der Schleife wuerde den Balken fuer immer einfrieren.
    progressTimer = setTimeout(pollProgress, PROGRESS_MS);
    return;
  }
  // Aus GENAU dieser Antwort neu rendern: ist der Lauf fertig (progress null),
  // steht die Badge "inkl. Schaden-Analyse" damit sofort da, statt bis zum
  // naechsten 60-s-Refresh zu warten. Laeuft er weiter, startet renderReport
  // die Schleife selbst neu.
  renderReport(rep, lastPhase);
}

function render(s) {
  if (s.refresh_seconds) REFRESH_MS = s.refresh_seconds * 1000;
  const game = s.phase === "in_game" || s.phase === "post_game";
  document.getElementById("nogame").hidden = game;
  document.getElementById("game").hidden = !game;
  // Der Regler in der Kopfzeile lebt ausserhalb von #game und braucht deshalb
  // sein eigenes Umschalten - mit derselben Bedingung: ohne laufendes Spiel
  // waere eine Vorab-Einstellung wirkungslos, weil der Server die Stufe bei
  // jedem neuen Spiel auf Neutral zuruecksetzt.
  document.getElementById("styleblock").hidden = !game;
  let meta = `Patch ${s.patch}`;
  if (game) meta += ` · ${Math.floor(s.game_time / 60)} min`;
  if (s.phase === "post_game") meta += " · Spiel beendet – letzter Stand";
  document.getElementById("meta").textContent = meta;

  // Banner + Ladebalken: die Phase wird gemerkt, weil das Progress-Polling sie
  // nicht mitgeliefert bekommt (der Mini-Endpunkt kennt nur den Report).
  lastPhase = s.phase;
  renderReport(s.postgame_report, s.phase);

  if (!game) return;

  const p = s.player, r = s.recommendations;
  // Du-Zeile als EIN Text: er wird escaped angezeigt UND roh in den title
  // gelegt, weil die CSS-Ellipsis lange Itemlisten abschneidet - ohne title
  // waere der abgeschnittene Teil verloren. `esc()` ueber den ganzen Satz deckt
  // Name und Itemnamen ab (Apostroph-Champions wie Kha'Zix brachen die alte,
  // ungeschuetzte Fassung).
  const meLine = `DU: ${p.name} ${p.role}`
    + ` · ${p.scores.kills}/${p.scores.deaths}/${p.scores.assists}`
    + ` · ${fmtGold(p.gold_spent)} G ausgegeben`
    + ` (${p.items.join(", ") || "keine Items"})`;
  const meEl = document.getElementById("me");
  meEl.innerHTML = esc(meLine);
  meEl.title = meLine;

  // Reglerstand vom Server uebernehmen - ausser der Nutzer zieht gerade daran.
  const slider = document.getElementById("styleRange");
  const lvl = s.playstyle && s.playstyle.level;
  if (lvl && !styleDragging && document.activeElement !== slider) {
    slider.value = lvl;
    markStyleLevel(lvl);
  }
  // style_note erklaert, WARUM die Empfehlung von der Datenwahrheit abweicht
  // (die Engine laesst sie bei Stufe 3 leer, dann steht hier nichts).
  document.getElementById("styleNote").innerHTML =
    r.style_note ? esc(r.style_note) : "";

  // Drei Zustaende an EINER Stelle (#next): Tausch-Karte, normale Next-Karte,
  // reiner Hinweistext. Die Gold-Zahlen laufen hier ueberall durch `fmtGold` -
  // "1.850 G" ist auf dem zweiten Monitor mit einem Blick zu erfassen, "1850 G"
  // musste man ziffernweise lesen (derselbe Grund wie bei der Team-Gold-Zeile).
  const n = r.next;
  const nextEl = document.getElementById("next");
  if (n) {
    const rest = n.cost_remaining !== undefined ? n.cost_remaining : n.cost;
    const price = rest < n.cost
      ? `${fmtGold(rest)} G (${fmtGold(n.cost)} G, davon ${fmtGold(n.cost - rest)} G durch Teilitems gedeckt)`
      : `${fmtGold(n.cost)} G`;
    if (n.swap) {
      // TAUSCH-ZUSTAND. Er kommt erst, wenn alle sechs Slots mit fertigen Items
      // belegt sind; davor ist an dieser Stelle NICHTS Sichtbares anders - kein
      // Verkaufshinweis, kein Tausch-Praefix, keine halbe Karte (Nutzer-Entscheid
      // 2026-09-05, "kein Vorgriff"). Deshalb ERSETZT die Karte den Next-Inhalt,
      // statt ihn zu ergaenzen: zu sehen ist genau eine Handlung, "verkauf X,
      // kauf Y". Die Kaufplan-Leiste blendet sich ueber ihr eigenes Gate aus
      // (purchase_plan ist in diesem Zustand null).
      const swap = n.swap;
      // Beide Seiten teilen sich EIN Icon-Markup - damit haengt der Tooltip
      // (delegiert ueber [data-item-id]) an X und Y gleichermassen. Ohne Assets
      // bleibt die Karte reine Textform, wie ueberall sonst.
      const icon = (id) => (s.assets_available && id)
        ? `<img class="iicon" data-item-id="${id}" src="assets/items/${id}.png" alt="" onerror="this.remove()">`
        : "";
      const swapCost = `${esc(n.item)} kostet ${fmtGold(rest)} G · Verkauf bringt ${fmtGold(swap.sell_value)} G`;
      // `affordable` rechnet den Verkaufserloes bereits ein - die Zeile macht nur
      // sichtbar, WORAUS sich das zusammenrechnet.
      let gold = `<span class="gold">${swapCost}</span>`;
      if (n.current_gold !== undefined) {
        gold = n.affordable
          ? `<span class="gold ok">${swapCost} · du hast ${fmtGold(n.current_gold)} G</span>`
          : `<span class="gold missing">${swapCost} · du hast ${fmtGold(n.current_gold)} G –
             es fehlen ${fmtGold(rest - n.current_gold - swap.sell_value)} G</span>`;
      }
      nextEl.innerHTML =
        `<div class="swap"><span class="swaplabel">Tausche</span>
           ${icon(swap.sell_item_id)}<span class="itemname sell">${esc(swap.sell_item)}</span>
           <span class="arrow">▸</span>
           ${icon(n.item_id)}<span class="itemname">${esc(n.item)}</span></div>
         ${n.tag ? `<span class="${tagClass(n)}">${esc(n.tag)}</span>` : ""} ${statBadges(n)} ${gold}
         <span class="muted">${esc(swap.reason)}</span>
         <span class="muted">${esc(n.reason)}</span>`;
    } else {
      let gold = price;
      if (n.slot_block) {
        // Inventar voll, aber ein Teilitem/Consumable belegt den Slot: getauscht
        // wird hier NICHT (der Spieler baut ja noch). Die Karte bleibt exakt wie
        // sonst - ehrlich wird allein die Gold-Zeile, denn "kaufbar" waere sie
        // nicht: der Slot fehlt, egal wie viel Gold da ist (affordable === false
        // kommt so aus der Engine). Kein Badge, kein Praefix - siehe "kein
        // Vorgriff" oben.
        const when = n.slot_block.kind === "consumable" ? "genutzt" : "fertig gebaut";
        const short = (n.current_gold !== undefined && rest > n.current_gold)
          ? `es fehlen ${fmtGold(rest - n.current_gold)} G, ` : "";
        gold = `<span class="gold missing">${price} – ${short}kaufbar,
                sobald ${esc(n.slot_block.item)} ${when} ist</span>`;
      } else if (n.current_gold !== undefined) {
        gold = n.affordable
          ? `<span class="gold ok">${price} – kaufbar (du hast ${fmtGold(n.current_gold)} G)</span>`
          : `<span class="gold missing">${price} – es fehlen ${fmtGold(rest - n.current_gold)} G</span>`;
      }
      // `now_rel === 100` heisst: der naechste Kauf IST der staerkste Kandidat -
      // und genau das ist die Regel, nicht die Ausnahme. Eine Anzeige dafuer waere
      // reine Tautologie ("der Top-Vorschlag ist der Top-Vorschlag"), darum bleibt
      // die Stelle leer. Ein ABWEICHENDER Wert kommt vor, wenn ein Timing-Gate
      // (Boots-Gate, Defensiv-Zweig) den Pool-Sieger ueberholt; nur dann zeigt der
      // Balken, wie stark dieser Kauf gegenueber der staerksten Karte der Liste ist.
      const nrel = (n.now_rel != null && n.now_rel !== 100) ? relBar(n.now_rel) : "";
      nextEl.innerHTML =
        `${s.assets_available && n.item_id ? `<img class="iicon" data-item-id="${n.item_id}" src="assets/items/${n.item_id}.png" alt="" onerror="this.remove()">` : ""}
         <span class="itemname">${n.item}</span>
         ${n.tag ? `<span class="${tagClass(n)}">${n.tag}</span>` : ""} ${statBadges(n)} ${nrel} ${gold}
         <span class="muted">${n.reason}</span>`;
    }
  } else {
    nextEl.innerHTML = r.note
      ? `<span class="muted">${r.note}</span>`
      : '<span class="muted">Build komplett – nichts mehr offen.</span>';
  }

  // Kaufplan-Leiste (Feature 001): hartes Feature-Gate - nur mit Assets UND Plan.
  // Faellt das Gate, wird der ganze Block inkl. "Item-Timeline"-Ueberschrift
  // ausgeblendet (hidden am Container, analog #nogame/#game).
  const plan = r.purchase_plan;
  const planEl = document.getElementById("plan");
  const gate = s.assets_available && plan && plan.length;
  document.getElementById("planblock").hidden = !gate;
  if (gate) {
    planEl.innerHTML = plan.map((st, i) => {
      const cls = ["step", st.final ? "step-final" : "step-component"];
      if (st.upgrade) cls.push("upgrade");
      else if (st.affordable) cls.push("afford");
      const title = st.upgrade
        ? `${esc(st.name)} · Quest-Upgrade – kostenlos`
        : `${esc(st.name)} · ${st.cost} G`;
      const chev = i > 0 ? `<span class="chevron">›</span>` : "";
      return `${chev}<div class="${cls.join(" ")}" title="${title}">
        <img data-item-id="${st.item_id}" src="assets/items/${st.item_id}.png" alt="" onerror="this.remove()"></div>`;
    }).join("");
  } else {
    planEl.innerHTML = "";
  }

  document.getElementById("confidence").innerHTML =
    (r.confidence && r.confidence !== "rich" && r.confidence_note)
      ? `<span class="badge">Basis-Empfehlung</span>
         <span class="muted">${r.confidence_note}</span>`
      : "";

  document.getElementById("stanceline").innerHTML =
    `<span class="stance ${r.stance}">${r.stance}</span>
     <span class="muted"> ${r.stance_reason}
     (Datenbasis: ${r.knowledge_games} High-Elo-Spiele)</span>`;

  // Die Engine liefert items[] bereits gewichtet sortiert (Pool-Score) - hier
  // wird nur noch gefiltert und getrennt:
  // 1. Der Next-Sieger steht oben gross und bleibt fuer die Messung in items[]
  //    (replay_candidates) - in der Liste waere er eine reine Dopplung.
  // 2. Vor der ersten Karte ohne Pool-Score kommt ein gedaempfter Trenner:
  //    Boots/Klassen-Fallback/Anti-Heal sind mit der Gewichtung nicht
  //    vergleichbar (`pool === false`; alte Payloads ohne Feld -> kein Trenner).
  //    Er kommt NUR, wenn vorher wirklich gewichtete Karten standen - sonst
  //    truege er nichts ab (Legacy-Modus ohne Pool-Scores, Support-Endwahl, oder
  //    wenn der einzige Pool-Eintrag der ausgeblendete Sieger war).
  // 3. Die Karten des festen Listen-Kopfs (`head`, Core + Boots in gelernter
  //    Bau-Reihenfolge) loesen den Trenner NIE aus: sie stehen vor der
  //    gewichteten Gruppe, auch wenn einzelne von ihnen keinen Pool-Score haben
  //    (Alternative, Comp-Hinweis) - der Trenner gehoert vor die erste Karte
  //    ohne Score, die NICHT zum Kopf gehoert.
  const nextItem = r.next ? r.next.item : null;
  let poolSeen = false, sepDone = false;
  document.getElementById("recs").innerHTML = r.items
    .filter(i => i.item !== nextItem)
    .map(i => {
      let sep = "";
      if (i.pool) poolSeen = true;
      else if (poolSeen && !sepDone && !i.head) {
        sepDone = true;
        sep = `<div class="sep">Weitere Optionen</div>`;
      }
      // Reihenfolge: kind | Icon | Name | Kaufstaerke | Zweck | Stats | Core/Klasse
      // | Grund. Die Kaufstaerke steht direkt hinter dem Namen (fixe min-width),
      // weil sie am Zeilenende hinter den variabel vielen Stat-Badges auf jeder
      // Karte woanders begann - untereinander lesbar war da nichts.
      // Karten OHNE Kaufstaerke (Boots, Klassen-Fallback, Anti-Heal unter dem
      // Trenner) bekommen einen unsichtbaren Platzhalter, sonst rutschen ihre
      // Zweck-Badges aus der Spalte (gleiches Muster wie beim Zweck-Badge selbst).
      return `${sep}<div class="card${i.alternative ? " alt" : ""}"><span class="kind">${i.kind}</span>
     ${s.assets_available && i.item_id ? `<img class="iicon" data-item-id="${i.item_id}" src="assets/items/${i.item_id}.png" alt="" onerror="this.remove()">` : ""}
     <span class="item">${i.item}</span>
     ${i.now_rel != null ? relBar(i.now_rel) : `<span class="nowrel" style="visibility:hidden">-</span>`}
     ${i.tag ? `<span class="${tagClass(i)}">${i.tag}</span>` : `<span class="tag" style="visibility:hidden">-</span>`}
     ${statBadges(i)}
     ${i.kind === "core" ? `<span class="core-badge" title="Teil des gelernten Core-Builds">Core</span>` : ""}
     ${i.source === "class" ? `<span class="src-class" title="aus Klassen-Daten (Fallback bei duenner Datenlage)">Klasse</span>` : ""}
     <span class="muted">${i.reason}</span></div>`;
    }).join("")
    // Leere Liste: seit der Regel "nur plausible naechste Kaeufe" kann das auch
    // FRUEH passieren (alles andere ist erst spaeter dran, und der einzige
    // Vorschlag steht schon oben gross) - dann waere "Build komplett" schlicht
    // falsch. Der Fall haengt daran, ob es ueberhaupt noch ein echtes Item gibt.
    || (r.next && r.next.kind !== "consumable"
        ? '<div class="muted">Nur der Vorschlag oben steht gerade an – '
          + 'Karten für spätere Käufe blendet die Liste aus.</div>'
        : '<div class="muted">Keine offenen Empfehlungen – Build komplett.</div>');

  document.getElementById("teamgold").innerHTML = teamGoldLine(s.team_gold);

  const spikes = {};
  (r.spike_warnings || []).forEach(w => { spikes[w.name] = w; });
  // Todes-Signal: NUR der Champion-Fall benennt einen Gegner (trigger
  // "damage_type" sagt "AP-Schaden", das gehoert auf keine einzelne Karte).
  const ds = r.death_signal;
  const deathChampion = ds && ds.trigger === "champion" ? ds.champion : null;
  document.getElementById("enemies").innerHTML =
    s.enemies.map(e => enemyCard(e, spikes[e.name], deathChampion)).join("");
}

let REFRESH_MS = 60000;   // Default; der Server liefert app.refresh_seconds aus config.yml mit
let nextRefreshAt = Date.now() + REFRESH_MS;

async function refresh() {
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spin");
  try {
    const resp = await fetch("/api/state");
    render(await resp.json());
  } catch (err) { /* Server weg -> beim naechsten Tick erneut versuchen */ }
  finally { btn.classList.remove("spin"); }
  nextRefreshAt = Date.now() + REFRESH_MS;
}

// Delegierter Listener statt Inline-onchange (Fix Apostroph-Champions): am
// Container registriert, ueberlebt jedes innerHTML-Neurendern der Karten.
document.getElementById("enemies").addEventListener("change", ev => {
  const sel = ev.target.closest("select.prio");
  if (sel) setPriority(sel.dataset.champion, sel.value);
});

// Der Regler-Block wird nie neu gebaut -> direkte Listener genuegen.
// `input` feuert bei jeder Bewegung (nur die Beschriftung mitziehen, kein
// Request pro Pixel), `change` erst beim Loslassen - dann geht der POST raus.
document.getElementById("styleRange").addEventListener("pointerdown", () => {
  styleDragging = true;
});
document.getElementById("styleRange").addEventListener("input", ev => {
  markStyleLevel(Number(ev.target.value));
});
document.getElementById("styleRange").addEventListener("change", ev => {
  setPlaystyle(Number(ev.target.value));
});
// Am document, nicht am Regler: wer ausserhalb loslaesst, bekommt sonst nie ein
// pointerup und das Flag bliebe fuer immer stehen (der Schieber wuerde danach
// nie wieder mit dem Server synchronisieren).
document.addEventListener("pointerup", () => { styleDragging = false; });
document.addEventListener("pointercancel", () => { styleDragging = false; });

// --- Item-Tooltip (Hover ueber ein Item-Icon) -------------------------------
// Zeigt die englische Data-Dragon-Beschreibung (Name, Preis, Kurztext, Stats/
// Passiven/Aktiven) - dieselbe Quelle, die auch die Engine liest, also gibt es
// keinen zweiten Wahrheitsstand ueber ein Item.

// Riot-Markup -> CSS-Klasse. Leerer Wert = reiner Container, dessen Tags
// verschwinden, waehrend der Inhalt bleibt (<mainText>, <font color=...>).
// Alles, was hier NICHT steht, wird spurlos entfernt: lieber ein Tag zu wenig
// gerendert als fremdes Markup ins DOM lassen.
const TT_TAGS = {
  maintext: "", font: "",
  stats: "tt-stats", attention: "tt-attention", rules: "tt-rules",
  flavortext: "tt-rules",
  passive: "tt-passive", active: "tt-active",
  keyword: "tt-keyword", keywordmajor: "tt-keyword", keywordstealth: "tt-keyword",
  spellname: "tt-keyword", unique: "tt-keyword", raritygeneric: "tt-keyword",
  raritylegendary: "tt-legendary", raritymythic: "tt-legendary",
  magicdamage: "tt-magic", scaleap: "tt-magic", scalemana: "tt-magic",
  physicaldamage: "tt-phys", scalead: "tt-phys", scalelethality: "tt-phys",
  attackspeed: "tt-phys", onhit: "tt-phys",
  truedamage: "tt-true",
  healing: "tt-heal", lifesteal: "tt-heal", omnivamp: "tt-heal",
  scalehealth: "tt-heal", health: "tt-heal",
  shield: "tt-shield",
  status: "tt-status", speed: "tt-status", scalelevel: "tt-status",
  scalearmor: "tt-status", scalemr: "tt-status", gold: "tt-status",
};

// Tag-Erkennung NACH dem Escapen: aus "<passive>" ist da "&lt;passive&gt;"
// geworden. Der Attribut-Teil wird mitgefressen und weggeworfen (nur der
// Tag-Name entscheidet) - er landet nie im erzeugten HTML.
const TT_TAG_RE = /&lt;(\/?)([a-zA-Z][a-zA-Z0-9]*)(?:(?!&gt;|&lt;)[\s\S])*&gt;/g;

// Riots Beschreibungstext in sicheres Anzeige-HTML uebersetzen.
// Reihenfolge ist der ganze Sicherheitstrick: ERST alles escapen (danach kann
// aus dem API-Text kein Element mehr entstehen), DANN nur die bekannte
// Whitelist wieder zu eigenen <span>/<br> aufwerten. Kein Roh-Text aus der API
// geht je ungefiltert ins DOM.
function riotText(desc) {
  let html = esc(desc);
  html = html.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  html = html.replace(/&lt;li&gt;/gi, "<br>&bull; ")
             .replace(/&lt;\/li&gt;/gi, "");
  return html.replace(TT_TAG_RE, (_m, slash, tag) => {
    const cls = TT_TAGS[tag.toLowerCase()];
    if (cls === undefined || cls === "") return "";   // unbekannt/Container -> weg
    return slash ? "</span>" : `<span class="${cls}">`;
  });
}

// item_id -> API-Antwort. Auch `found:false` wird gecacht: sonst feuert jeder
// Hover ueber dasselbe unbekannte Item einen neuen Request.
const TT_CACHE = new Map();
let ttCurrent = null;   // Item-ID, ueber der die Maus gerade steht (null = keine)

function ttEl() { return document.getElementById("tooltip"); }

function ttHide() {
  ttCurrent = null;
  ttEl().hidden = true;
}

// Am Cursor ausrichten und am Viewport klemmen: ohne das Klemmen liefe der
// Tooltip an der rechten/unteren Kante aus dem Bild und waere unlesbar.
function ttPlace(x, y) {
  const el = ttEl(), pad = 16, edge = 8;
  const r = el.getBoundingClientRect();
  let left = x + pad, top = y + pad;
  if (left + r.width > window.innerWidth - edge) {
    left = Math.max(edge, x - pad - r.width);
  }
  if (top + r.height > window.innerHeight - edge) {
    top = Math.max(edge, window.innerHeight - edge - r.height);
  }
  el.style.left = `${left}px`;
  el.style.top = `${top}px`;
}

function ttHtml(d) {
  const combine = (d.gold_base && d.gold_base !== d.gold_total)
    ? ` <span class="tt-rules">(Kombi ${d.gold_base} G)</span>` : "";
  return `<div class="tt-name">${esc(d.name)}</div>
    <div class="tt-gold">${d.gold_total} G${combine}</div>
    ${d.plaintext ? `<div class="tt-plain">${esc(d.plaintext)}</div>` : ""}
    ${d.description ? `<div class="tt-body">${riotText(d.description)}</div>` : ""}`;
}

async function ttShow(id, x, y) {
  const el = ttEl();
  let data = TT_CACHE.get(id);
  if (data === undefined) {
    // Waehrend des Fetches schon etwas zeigen - sonst wirkt der erste Hover tot.
    el.innerHTML = `<span class="tt-rules">&hellip;</span>`;
    el.hidden = false;
    ttPlace(x, y);
    try {
      data = await (await fetch(`/api/item/${encodeURIComponent(id)}`)).json();
    } catch (err) { data = { found: false }; }   // Server weg -> stumm bleiben
    TT_CACHE.set(id, data);
    if (ttCurrent !== id) return;   // Maus ist weitergezogen -> Antwort verwerfen
  }
  if (!data || !data.found) { ttHide(); return; }
  el.innerHTML = ttHtml(data);
  el.hidden = false;
  ttPlace(x, y);
}

// Delegiert am document registriert (gleiche Begruendung wie beim Prio-Listener
// oben): die Icons entstehen bei jedem Refresh per innerHTML neu, direkt an
// ihnen haengende Handler waeren danach weg.
document.addEventListener("mouseover", ev => {
  const icon = ev.target.closest ? ev.target.closest("[data-item-id]") : null;
  if (!icon) return;
  const id = icon.dataset.itemId;
  if (id === ttCurrent) return;
  ttCurrent = id;
  ttShow(id, ev.clientX, ev.clientY);
});

document.addEventListener("mouseout", ev => {
  if (ev.target.closest && ev.target.closest("[data-item-id]")) ttHide();
});

document.addEventListener("mousemove", ev => {
  if (ttCurrent !== null && !ttEl().hidden) ttPlace(ev.clientX, ev.clientY);
});

setInterval(() => {
  const remain = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
  document.getElementById("countdown").textContent = `⟳ in ${remain}s`;
  if (remain === 0) refresh();
}, 1000);
refresh();
</script>
</body>
</html>
